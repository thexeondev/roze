// @desc 账号登录结果
// @TextCode
enum EnmTextCode
{
    //通用成功返回
    ENM_TEXT_OK                        = 0;

    // [100~300] 框架层预留, 勿用
    ENM_TEXT_CMD_FORBIDDEN_BY_SERVER      = 100;  // 该协议被服务器禁止使用
    ENM_TEXT_CS_PB_VERDIFF = 101; // cspb版本不一致
    ENM_TEXT_ACC_LOGIN_SERVER_NOT_OPEN_FAIL = 102; // 服务器在准备中，尚未开放
    ENM_TEXT_ACC_LOGIN_NOT_IN_WHITE_LIST    = 103; // 不在白名单中
    ENM_TEXT_ACC_LOGIN_ACCOUNT_BAN          = 104; // 账号被封禁
    ENM_TEXT_ACC_LOGIN_VERSION_NOT_MATCH    = 105; // 版本不匹配
    ENM_TEXT_ACC_LOGIN_IP_NOT_ALLOW         = 106; // IP不允许登录
    ENM_TEXT_ACC_LOGIN_ACCOUNT_DATA_FAIL    = 107; // 账号数据错误
    ENM_TEXT_ACC_LOGIN_ACCOUNT_ONLINE       = 108; // 账号已经在别处登录
    ENM_TEXT_ACC_LOGIN_ACCOUNT_EMPTY        = 109; // 账号为空
    ENM_TEXT_ACC_LOGIN_ACCOUNT_PASSWD_ERR   = 110; // 密码错误
    ENM_TEXT_ACC_LOGIN_ACCOUNT_PASSWD_EMPTY = 111; // 密码为空
    ENM_TEXT_CREATE_ROLE_RET_NAME_EXIST            = 112; // 角色名已存在
    ENM_TEXT_CREATE_ROLE_RET_INIT_ROLE_DATA_FAIL   = 113; // 角色数据初始化失败
    ENM_TEXT_NOT_ACC_LOGIN                         = 114; // 非账号登录状态
    ENM_TEXT_CREATE_ROLE_RET_INSERT_ROLE_DATA_FAIL = 115; // 插入角色数据失败
