syntax = "proto3";
package msg;

import "comm_data.proto";

// ============================================================
// 公共子结构
// ============================================================

// 关卡摘要信息
message CoffeeStageInfo {
    uint32 stage_id         = 1;  // 关卡配置 ID (P_CoffeeStage.ID)
    uint32 status           = 2;  // 0=未解锁 1=已解锁 2=已通关
    uint32 best_score       = 3;  // 历史最高总分
    repeated uint32 index_star = 4;  // 本关卡完成的哪几个星
    uint64 progress         = 5;  // 解锁进度（未解锁关卡的当前进度值）
    uint64 need_count       = 6;  // 解锁目标（未解锁关卡的目标进度值）
}

// ============================================================
// 请求 / 响应
// ============================================================

// @desc 请求关卡列表信息
// @cmd CS_REQ_COFFEE_STAGE_INFO
message CS_Req_Coffee_Stage_Info {
}

// @desc 返回关卡列表信息
// @cmd SC_RES_COFFEE_STAGE_INFO
message SC_Res_Coffee_Stage_Info {
    int32 result                        = 1;
    repeated CoffeeStageInfo stages     = 2;  // 所有关卡状态
}

// @desc 开始一个关卡
// @cmd CS_REQ_COFFEE_START_STAGE
message CS_Req_Coffee_Start_Stage {
    uint32 stage_id = 1;  // 要开始的关卡 ID
}

// @desc 确认关卡已开始
// @cmd SC_RES_COFFEE_START_STAGE
message SC_Res_Coffee_Start_Stage {
    int32 result    = 1;
    uint32 stage_id = 2;
}

// @desc 完成关卡结算（客户端上报总分）
// @cmd CS_REQ_COFFEE_FINISH_STAGE
message CS_Req_Coffee_Finish_Stage {
    uint32 stage_id     = 1;  // 关卡 ID
    uint32 total_score  = 2;  // 关卡评分
    repeated uint32 index_star  = 3;  // 本次完成的哪几个星
}

// @desc 关卡结算结果
// @cmd SC_RES_COFFEE_FINISH_STAGE
message SC_Res_Coffee_Finish_Stage {
    int32 result                            = 1;
    uint32 stage_id                         = 2;
    uint32 total_score                      = 3;  // 服务器确认的总分
    repeated uint32 index_star              = 4;  // 本次完成的哪几个星
    repeated ItemIdCount rank_rewards       = 5;  // 本次条件达成奖励
    bool   is_new_best                      = 6;  // 是否刷新最高纪录
}

// @desc 领取重复奖励（消耗风险值）
// @cmd CS_REQ_COFFEE_CLAIM_REWARD
message CS_Req_Coffee_Claim_Reward {
    uint32 stage_id = 1;
    uint32 receive_times = 2; //领取次数
}

// @desc 领取重复奖励结果
// @cmd SC_RES_COFFEE_CLAIM_REWARD
message SC_Res_Coffee_Claim_Reward {
    int32 result                    = 1;
    repeated ItemIdCount rewards    = 2;  // 实际发放的奖励
}

// @desc 查询当前进行中的关卡
// @cmd CS_REQ_COFFEE_GET_ACTIVE_STAGE
message CS_Req_Coffee_Get_Active_Stage {
}

// @desc 当前进行中的关卡查询响应
// @cmd SC_RES_COFFEE_GET_ACTIVE_STAGE
message SC_Res_Coffee_Get_Active_Stage {
    int32 result    = 1;
    uint32 stage_id = 2;  // 当前进行中的关卡 ID（0 = 无进行中关卡）
    repeated uint32 unlock_ingre_ids = 3; // 解锁的咖啡原料id
    repeated uint32 unlock_add_ins_ids = 4; // 解锁的咖啡配料id
}
